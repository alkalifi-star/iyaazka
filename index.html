
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabel Angka 1-100</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h1>TABEL ANGKA 1-100</h1>

        <div class="tabel-angka" id="tabelAngka">
        </div>
    </div>

    <script>
        let tabel = document.getElementById("tabelAngka");

        for (let i = 1; i <= 100; i++) {
            let angka = document.createElement("div");

            angka.className = "angka";
            angka.textContent = i;

            tabel.appendChild(angka);
        }
    </script>

</body>
</html>
